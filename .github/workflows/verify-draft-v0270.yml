name: Measure 0.27.0 terminal input on a contended CPU
on:
  push:
    branches: [release-signatures-v0270]
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare the CLI build artifacts on the same CPU
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prev="$RUNNER_TEMP/previous"
          curr="$RUNNER_TEMP/current"
          for spec in "44628304153 $prev" "44708624263 $curr"; do
            read -r run dir <<< "$spec"
            gh run download "$run" -R "$GITHUB_REPOSITORY" -n dist-linux -D "$dir"
            chmod +x "$dir/vibeke-linux-x86_64"
          done
          new="$curr/vibeke-linux-x86_64"
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          taskset -c "$cpu" yes >/dev/null &
          hog=$!
          trap 'kill "$hog" 2>/dev/null || true' EXIT
          for v in previous new new previous; do
            bin="$new"
            if [[ "$v" == previous ]]; then bin="$prev/vibeke-linux-x86_64"; fi
            taskset -c "$cpu" "$new" debug tui-latency --binary "$bin" --n 150 --json > "$RUNNER_TEMP/sample.json"
            jq -c --arg version "$v" '{version:$version,latency_ms}' "$RUNNER_TEMP/sample.json" | tee -a "$GITHUB_STEP_SUMMARY"
          done
