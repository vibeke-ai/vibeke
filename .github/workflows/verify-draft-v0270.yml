name: Verify Vibeke 0.27.0 release draft
on:
  push:
    branches: [release-signatures-v0270]
permissions:
  contents: write # downloading draft assets requires repository push access
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: sudo apt-get update -qq && sudo apt-get install -y minisign
      - working-directory: web
        run: bun install --frozen-lockfile
      - name: Verify signed draft assets and desktop update feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/draft"
          mkdir "$dir"
          gh release view v0.27.0 --json assets,isDraft,isPrerelease,tagName > "$RUNNER_TEMP/assets.json"
          jq -e '.isDraft and (.isPrerelease|not)' "$RUNNER_TEMP/assets.json"
          gh release download v0.27.0 --dir "$dir"
          minisign -Vm "$dir/SHA256SUMS" -p keys/vibeke-2026.pub
          minisign -Vm "$dir/manifest.json" -p keys/vibeke-2026.pub
          python3 .github/release-assets.py "$dir" "$RUNNER_TEMP/assets.json" signed
          bun web/apps/desktop/scripts/verify-update-feed.ts "$dir"
          chmod +x "$dir/vibeke-linux-x86_64"
          "$dir/vibeke-linux-x86_64" --version | grep -F '0.27.0'
      - name: Measure real TUI key-to-screen latency under CPU contention
        run: |
          set -euo pipefail
          new="$RUNNER_TEMP/draft/vibeke-linux-x86_64"
          prev="$RUNNER_TEMP/prev"
          mkdir "$prev"
          for f in vibeke-linux-x86_64 SHA256SUMS SHA256SUMS.minisig; do
            curl --retry 3 -fsSL "https://github.com/vibeke-ai/vibeke/releases/download/v0.26.1/$f" -o "$prev/$f"
          done
          minisign -Vm "$prev/SHA256SUMS" -p keys/vibeke-2026.pub
          (cd "$prev" && grep -F '  vibeke-linux-x86_64' SHA256SUMS | sha256sum -c)
          chmod +x "$prev/vibeke-linux-x86_64"
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          taskset -c "$cpu" yes >/dev/null &
          hog=$!
          trap 'kill "$hog" 2>/dev/null || true' EXIT
          for v in previous new new previous; do
            bin="$new"
            if [[ "$v" == previous ]]; then bin="$prev/vibeke-linux-x86_64"; fi
            taskset -c "$cpu" "$new" debug tui-latency --binary "$bin" --n 150 --json > "$RUNNER_TEMP/sample.json"
            jq -c --arg version "$v" '{version:$version,latency_ms}' "$RUNNER_TEMP/sample.json" | tee -a "$GITHUB_STEP_SUMMARY"
          done
