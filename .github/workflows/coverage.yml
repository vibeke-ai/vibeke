name: coverage
# Line coverage with cargo-llvm-cov over the same nextest run as `mise run test` (spec 10 3:
# target >= 80% on vk-proto, vk-hold, vk-store, vk-agents, vk-compat). The per-crate table goes
# to the job summary and the lcov file is uploaded. The run only fails below the target when the
# repository variable COVERAGE_ENFORCE is "true", so the gate can be switched on once the
# numbers are there.
on:
  # Nightly only: pushes run just the `ci` workflow (speed, Actions minutes).
  schedule:
    - cron: "11 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov
      - run: rustup component add llvm-tools-preview
      - name: Tests under coverage
        run: >
          cargo llvm-cov nextest --workspace --lcov --output-path lcov.info
          --ignore-filename-regex '(/tests/|_tests?\.rs$|/build\.rs$|/vendor/)'
      - name: Per-crate gate
        env:
          ENFORCE: ${{ vars.COVERAGE_ENFORCE }}
        run: |
          if [ "$ENFORCE" = "true" ]; then
            python3 scripts/coverage-check.py lcov.info --enforce
          else
            python3 scripts/coverage-check.py lcov.info
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: ignore
