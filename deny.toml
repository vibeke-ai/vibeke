[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
  # webpki-roots 0.26.11 (via tokio-tungstenite) only re-exports webpki-roots 1.x, which is at
  # 1.0.10 with the emSign root removed. Drop this when tokio-tungstenite moves to 1.x.
  { id = "RUSTSEC-2026-0381", reason = "0.26.11 re-exports the fixed webpki-roots 1.0.10" },
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0", "MPL-2.0", "BSL-1.0", "0BSD", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
